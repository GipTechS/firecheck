<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FireCheck — Sistema Gestione Estintori</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#0f1117">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FireCheck">

  <!-- Librerie esterne (CDN) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.6.0/jspdf.plugin.autotable.min.js"></script>

  <!-- Font Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Foglio di stile applicazione -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Slot HTML caricati dinamicamente via fetch() -->
  <div id="slot-header"></div>
  <div id="slot-main"></div>
  <div id="slot-footer"></div>

  <!-- ───────────────────────────────────────────────────────────────
       LOADER: assembla i partial HTML, poi carica script.js (JSX)
       e lo passa a Babel per la trasformazione runtime.
  ─────────────────────────────────────────────────────────────────── -->
  <script>
    (async function bootstrap() {
      const partials = [
        { file: 'header.html', slot: 'slot-header' },
        { file: 'main.html',   slot: 'slot-main'   },
        { file: 'footer.html', slot: 'slot-footer' }
      ];

      try {
        // 1) Carica e inietta i partial HTML
        for (const p of partials) {
          const res = await fetch(p.file);
          if (!res.ok) throw new Error('Impossibile caricare ' + p.file + ' (HTTP ' + res.status + ')');
          document.getElementById(p.slot).innerHTML = await res.text();
        }

        // 2) Carica il sorgente JSX e trasformalo con Babel
        const resScript = await fetch('script.js');
        if (!resScript.ok) throw new Error('Impossibile caricare script.js (HTTP ' + resScript.status + ')');
        const sourceCode = await resScript.text();

        const transformed = Babel.transform(sourceCode, {
          presets: ['react', 'env']
        }).code;

        // 3) Esegui il codice trasformato
        const tag = document.createElement('script');
        tag.textContent = transformed;
        document.body.appendChild(tag);

      } catch (err) {
        console.error('[FireCheck bootstrap]', err);
        document.body.innerHTML =
          '<pre style="color:#ef4444;padding:2rem;font-family:monospace;background:#0f1117;min-height:100vh;margin:0;white-space:pre-wrap;">'
          + 'Errore di caricamento: ' + err.message + '\n\n'
          + 'fetch() non funziona aprendo il file con doppio click (protocollo file://).\n'
          + 'Avvia un mini-server HTTP nella cartella del progetto, ad esempio:\n\n'
          + '   python3 -m http.server 8000\n'
          + '   # poi apri http://localhost:8000\n\n'
          + 'oppure con Node:\n\n'
          + '   npx serve .\n'
          + '</pre>';
      }
    })();

    // Registrazione service worker (PWA: installabilità + funzionamento offline)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => console.error('[SW] registrazione fallita', err));
      });
    }
  </script>
</body>
</html>
